<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отзывы</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f7;
      --card: #ffffff;
      --text: #17202a;
      --muted: #5c6b7a;
      --border: #d7dde4;
      --accent: #1f6feb;
      --accent-hover: #1558b0;
      --success: #1a7f37;
      --pending: #9a6700;
      --error: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #eef3f8 0%, #f8fafc 100%);
      color: var(--text);
    }

    .container {
      width: min(1600px, calc(100% - 32px));
      margin: 0 auto;
      padding: 16px 0 32px;
    }

    .hero, .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .hero {
      padding: 14px 24px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 2px;
      font-size: clamp(20px, 2.6vw, 28px);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      padding: 22px;
    }

    .layout > .panel:first-child {
      position: sticky;
      top: 16px;
      align-self: start;
    }

    .layout > .panel:last-child {
      max-height: calc(100vh - 140px);
      overflow-y: auto;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    input, textarea, button {
      font: inherit;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    input:focus, textarea:focus {
      outline: 2px solid rgba(31, 111, 235, 0.15);
      border-color: var(--accent);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.7; cursor: wait; }

    .demo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f7f9fc;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.35;
    }
    .demo-badge__dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); flex: 0 0 auto;
    }
    .demo-badge--low .demo-badge__dot { background: var(--pending); }
    .demo-badge--empty .demo-badge__dot { background: var(--error); }
    .demo-badge--empty { color: var(--error); }
    .demo-badge[hidden] { display: none; }

    .message {
      min-height: 20px;
      font-size: 14px;
    }

    .message.error { color: var(--error); }
    .message.success { color: var(--success); }

    .reviews {
      display: grid;
      gap: 14px;
    }

    .review-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      background: #fff;
    }

    .review-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge.new {
      color: var(--pending);
      background: rgba(154, 103, 0, 0.12);
    }

    .badge.processed {
      color: var(--success);
      background: rgba(26, 127, 55, 0.12);
    }

    .badge.positive {
      color: #0f6b3f;
      background: rgba(15, 107, 63, 0.12);
    }

    .badge.negative {
      color: #b42318;
      background: rgba(180, 35, 24, 0.12);
    }

    .badge.neutral {
      color: #1f4b99;
      background: rgba(31, 75, 153, 0.12);
    }

    .review-text {
      margin: 0 0 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .response-box {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      color: var(--muted);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .review-children {
      display: grid;
      gap: 8px;
      margin-top: 6px;
      padding-left: 16px;
      border-left: 2px solid rgba(31, 111, 235, 0.12);
    }

    .reply-form {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .reply-grid {
      display: grid;
      grid-template-columns: minmax(0, 220px) minmax(120px, 420px) auto;
      gap: 10px;
      align-items: center;
      justify-content: start;
    }

    .reply-form button {
      align-self: center;
      min-width: auto;
      padding: 9px 16px;
    }

    .reply-message {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      min-height: 0;
    }

    .reply-message:empty {
      margin-top: 0;
    }

    .reply-message.error { color: var(--error); }
    .reply-message.success { color: var(--success); }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 28px 12px;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .layout > .panel:first-child {
        position: static;
      }

      .layout > .panel:last-child {
        max-height: none;
        overflow: visible;
      }

      .container {
        width: min(100% - 20px, 960px);
        padding-top: 20px;
      }

      .reply-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>Форма отзывов</h1>
      <p class="subtitle">
        Оставьте отзыв, а система сохранит его и автоматически подготовит ответ. Список обновляется без перезагрузки страницы.
      </p>
    </section>

    <section class="layout">
      <div class="panel">
        <div id="demo-badge" class="demo-badge" hidden>
          <span class="demo-badge__dot"></span>
          <span id="demo-badge__text">Демо-сессия…</span>
        </div>
        <form id="review-form">
          <label>
            Имя (необязательно)
            <input type="text" id="name" name="name" maxlength="255" placeholder="Например, Анна">
          </label>

          <label>
            Отзыв
            <textarea id="text" name="text" required maxlength="5000" placeholder="Напишите ваш отзыв"></textarea>
          </label>

          <button id="submit-button" type="submit">Отправить</button>
          <div id="form-message" class="message" aria-live="polite"></div>
        </form>
      </div>

      <div class="panel">
        <div id="reviews" class="reviews"></div>
      </div>
    </section>
  </main>

  <script>
    const reviewsContainer = document.getElementById("reviews");
    const reviewForm = document.getElementById("review-form");
    const formMessage = document.getElementById("form-message");
    const submitButton = document.getElementById("submit-button");

    // ── Демо-сессия: токенизированный лимиттер с квотой на публикации ──────
    // Токен хранится в localStorage, передаётся заголовком X-Demo-Token на
    // POST /api/reviews и GET /api/demo/status. Backend — единственный SOT квоты.
    const DEMO_KEY = "review_demo_token";
    const demoBadge = document.getElementById("demo-badge");
    const demoBadgeText = document.getElementById("demo-badge__text");
    let demoToken = localStorage.getItem(DEMO_KEY);
    let demoLimit = 0;

    function demoHeaders(extra) {
      const h = Object.assign({}, extra || {});
      if (demoToken) h["X-Demo-Token"] = demoToken;
      return h;
    }

    function updateDemoBadge(remaining) {
      if (!demoBadge) return;
      demoBadge.hidden = false;
      demoBadge.classList.remove("demo-badge--low", "demo-badge--empty");
      if (remaining <= 0) {
        demoBadge.classList.add("demo-badge--empty");
        demoBadgeText.textContent = "Лимит демо-сессии исчерпан. Обновите страницу для новой сессии.";
        if (submitButton) submitButton.disabled = true;
        return;
      }
      if (remaining <= 2) demoBadge.classList.add("demo-badge--low");
      demoBadgeText.textContent = "Демо: осталось " + remaining + " из " + demoLimit;
    }

    function setDemoBadgeError(text) {
      if (!demoBadge) return;
      demoBadge.hidden = false;
      demoBadge.classList.remove("demo-badge--low");
      demoBadge.classList.add("demo-badge--empty");
      demoBadgeText.textContent = text;
      if (submitButton) submitButton.disabled = true;
    }

    async function startDemoSession() {
      try {
        const resp = await fetch("/api/demo/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}"
        });
        if (!resp.ok) { demoBadge.hidden = true; return null; }
        const data = await resp.json();
        demoToken = data.token;
        demoLimit = data.requests_limit;
        localStorage.setItem(DEMO_KEY, demoToken);
        return data;
      } catch (_) {
        demoBadge.hidden = true;
        return null;
      }
    }

    async function ensureDemoSession() {
      if (!demoToken) await startDemoSession();
      if (!demoToken) return;
      try {
        const resp = await fetch("/api/demo/status", { headers: demoHeaders() });
        if (resp.status === 401 || resp.status === 404) {
          localStorage.removeItem(DEMO_KEY);
          demoToken = null;
          await startDemoSession();
        } else if (resp.ok) {
          const data = await resp.json();
          demoLimit = data.requests_limit;
          updateDemoBadge(data.requests_remaining);
          return;
        }
      } catch (_) { /* сеть — статус обновится после первого POST */ }
      if (demoToken && demoLimit) updateDemoBadge(demoLimit);
    }

    // Обработка demo-ошибок POST /api/reviews. Бросает Error для demo-статусов
    // (401/403/429) с русским текстом и обновляет бейдж; возвращает false для
    // прочих статусов (тогда вызывающий показывает default-сообщение).
    async function handleDemoError(response) {
      const st = response.status;
      if (st !== 401 && st !== 403 && st !== 429) return false;
      const errorData = await response.json().catch(() => ({}));
      const detail = (typeof errorData.detail === "string" ? errorData.detail : "").toLowerCase();
      if (st === 401) {
        setDemoBadgeError("Демо-сессия истекла. Обновите страницу, чтобы начать новую.");
        throw new Error("Демо-сессия истекла. Обновите страницу, чтобы начать новую.");
      }
      if (st === 429) {
        if (detail.includes("rate")) throw new Error("Подождите несколько секунд перед следующим отзывом.");
        setDemoBadgeError("Лимит демо-сессии исчерпан. Обновите страницу для новой сессии.");
        throw new Error("Лимит демо-сессии исчерпан. Обновите страницу для новой сессии.");
      }
      throw new Error("Демо-сессия недоступна. Обновите страницу, чтобы начать новую.");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      return new Date(value).toLocaleString("ru-RU");
    }

    function statusLabel(status) {
      return status === "processed" ? "обработан" : "новый";
    }

    function toneLabel(tone) {
      if (tone === "positive") return "положительный";
      if (tone === "negative") return "отрицательный";
      if (tone === "neutral") return "нейтральный";
      return "";
    }

    function buildReviewTree(reviews) {
      const nodes = new Map(
        reviews.map((review) => [review.id, { ...review, children: [] }])
      );
      const roots = [];

      for (const node of nodes.values()) {
        if (node.parent_id && nodes.has(node.parent_id)) {
          nodes.get(node.parent_id).children.push(node);
        } else {
          roots.push(node);
        }
      }

      return roots;
    }

    function renderReview(review) {
      const childrenHtml = review.children.map(renderReview).join("");

      return `
        <article class="review-item">
          <div class="review-meta">
            <span><strong>${escapeHtml(review.name || "Аноним")}</strong></span>
            <span>${formatDate(review.created_at)}</span>
            <span class="badge ${escapeHtml(review.status)}">${statusLabel(review.status)}</span>
            ${review.tone ? `<span class="badge ${escapeHtml(review.tone)}">${toneLabel(review.tone)}</span>` : ""}
          </div>
          <p class="review-text">${escapeHtml(review.text)}</p>
          ${review.response ? `<div class="response-box"><strong>Ответ системы:</strong><br>${escapeHtml(review.response)}</div>` : ""}
          <form class="reply-form" data-parent-id="${review.id}">
            <div class="reply-grid">
              <input type="text" name="name" maxlength="255" placeholder="Ваше имя">
              <input type="text" name="text" required maxlength="5000" placeholder="Комментарий">
              <button type="submit">Ответить</button>
            </div>
            <div class="reply-message" aria-live="polite"></div>
          </form>
          ${childrenHtml ? `<div class="review-children">${childrenHtml}</div>` : ""}
        </article>
      `;
    }

    function renderReviews(reviews) {
      if (!reviews.length) {
        reviewsContainer.innerHTML = '<div class="empty">Пока нет отзывов.</div>';
        return;
      }

      const reviewTree = buildReviewTree(reviews);
      reviewsContainer.innerHTML = reviewTree.map(renderReview).join("");
    }

    function replyFormDirtyOrFocused() {
      const active = document.activeElement;
      if (active && active.closest && active.closest(".reply-form")) {
        return true;
      }
      for (const form of reviewsContainer.querySelectorAll(".reply-form")) {
        const name = form.querySelector('input[name="name"]');
        const text = form.querySelector('input[name="text"]');
        if ((name && name.value.trim()) || (text && text.value.trim())) {
          return true;
        }
      }
      return false;
    }

    async function loadReviews({ force = false } = {}) {
      try {
        const response = await fetch("/api/reviews");
        if (!response.ok) {
          throw new Error("Не удалось загрузить отзывы.");
        }

        const reviews = await response.json();
        // Не затираем формы ответа, пока пользователь печатает или ввёл значение —
        // иначе авто-рефреш каждые 5с сбрасывает введённый текст.
        if (!force && replyFormDirtyOrFocused()) {
          return;
        }
        renderReviews(reviews);
      } catch (error) {
        reviewsContainer.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    reviewsContainer.addEventListener("submit", async (event) => {
      const replyForm = event.target.closest(".reply-form");
      if (!replyForm) {
        return;
      }

      event.preventDefault();

      const message = replyForm.querySelector(".reply-message");
      const submitButton = replyForm.querySelector('button[type="submit"]');
      const nameInput = replyForm.querySelector('input[name="name"]');
      const textInput = replyForm.querySelector('input[name="text"]');
      const parentId = Number(replyForm.dataset.parentId);

      message.textContent = "";
      message.className = "reply-message";

      if (!textInput.value.trim()) {
        message.textContent = "Введите текст комментария.";
        message.classList.add("error");
        return;
      }

      submitButton.disabled = true;

      try {
        const response = await fetch("/api/reviews", {
          method: "POST",
          headers: demoHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({
            parent_id: parentId,
            name: nameInput.value,
            text: textInput.value
          })
        });

        if (!response.ok) {
          await handleDemoError(response); // бросает для demo-статусов, иначе false
          const errorData = await response.json().catch(() => ({}));
          const detail = errorData.detail || "Не удалось сохранить комментарий.";
          throw new Error(typeof detail === "string" ? detail : "Не удалось сохранить комментарий.");
        }

        const remaining = response.headers.get("X-Demo-Remaining");
        if (remaining !== null) updateDemoBadge(Number(remaining));

        replyForm.reset();
        message.textContent = "Комментарий добавлен.";
        message.classList.add("success");
        await loadReviews({ force: true });
      } catch (error) {
        message.textContent = error.message;
        message.classList.add("error");
      } finally {
        submitButton.disabled = false;
      }
    });

    reviewForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      formMessage.textContent = "";
      formMessage.className = "message";

      const payload = {
        name: document.getElementById("name").value,
        text: document.getElementById("text").value
      };

      if (!payload.text.trim()) {
        formMessage.textContent = "Введите текст отзыва.";
        formMessage.classList.add("error");
        return;
      }

      submitButton.disabled = true;

      try {
        const response = await fetch("/api/reviews", {
          method: "POST",
          headers: demoHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          await handleDemoError(response); // бросает для demo-статусов, иначе false
          const errorData = await response.json().catch(() => ({}));
          const detail = errorData.detail || "Не удалось сохранить отзыв.";
          throw new Error(typeof detail === "string" ? detail : "Не удалось сохранить отзыв.");
        }

        const remaining = response.headers.get("X-Demo-Remaining");
        if (remaining !== null) updateDemoBadge(Number(remaining));

        reviewForm.reset();
        formMessage.textContent = "Отзыв сохранен.";
        formMessage.classList.add("success");
        await loadReviews({ force: true });
      } catch (error) {
        formMessage.textContent = error.message;
        formMessage.classList.add("error");
      } finally {
        submitButton.disabled = false;
      }
    });

    ensureDemoSession();
    loadReviews();
    setInterval(loadReviews, 5000);
  </script>
</body>
</html>
