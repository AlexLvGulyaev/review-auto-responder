# review-auto-responder — единая среда: БД + сайт отзывов + обработчик.
#
# Запуск:  cp .env.example .env  &&  заполнить секреты  &&  docker compose up -d --build
# Подробно — docs/DEPLOYMENT_GUIDE.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reviews_db}
      POSTGRES_USER: ${POSTGRES_USER:-reviews_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviews_password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reviews_user} -d ${POSTGRES_DB:-reviews_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  review-site:
    build: ./site
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reviews_db}
      POSTGRES_USER: ${POSTGRES_USER:-reviews_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviews_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      WORKER_API_TOKEN: ${WORKER_API_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_DEMO_TOKEN: ${ADMIN_DEMO_TOKEN}
      ADMIN_AUTH_ENABLED: ${ADMIN_AUTH_ENABLED:-true}
      RUNTIME_PROMPT_PATH: /data/runtime/system_prompt.md
      WORKER_STATUS_PATH: /data/runtime/status.json
      # Адрес внутреннего test-API воркера (кнопка «Проверить» в /admin).
      # Порт НЕ публикуется на хост — сайт обращается по DNS сервиса compose.
      WORKER_TEST_URL: http://review-worker:${WORKER_API_PORT:-8001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - runtime-config:/data/runtime
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  review-worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      review-site:
        condition: service_healthy
    environment:
      TARGET_SITE_URL: http://review-site:8000
      WORKER_API_TOKEN: ${WORKER_API_TOKEN}
      # Внутренний test-HTTP-сервер (кнопка «Проверить» в /admin). Порт НЕ
      # публикуется на хост — сайт проксирует через DNS review-worker:8001.
      WORKER_API_PORT: ${WORKER_API_PORT:-8001}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-10}
      STATE_FILE_PATH: /service/data/state.json
      HEARTBEAT_FILE_PATH: /service/data/heartbeat.json
      RUNTIME_CONFIG_PATH: /data/runtime/config.json
      RUNTIME_PROMPT_PATH: /data/runtime/system_prompt.md
      WORKER_STATUS_PATH: /data/runtime/status.json
      AI_AUTHOR_NAME: ${AI_AUTHOR_NAME:-AI Support}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      GIGACHAT_TOKEN_URL: ${GIGACHAT_TOKEN_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_USER_CHAT_ID: ${TELEGRAM_USER_CHAT_ID:-}
      WORKER_HEALTHCHECK_MAX_AGE: ${WORKER_HEALTHCHECK_MAX_AGE:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - .env
    volumes:
      - runtime-config:/data/runtime
      - worker-data:/service/data
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  db-data:
  runtime-config:
  worker-data: